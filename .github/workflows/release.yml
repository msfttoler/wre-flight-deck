name: Release provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm test
      - name: Package the exact source revision
        run: git archive --format=tar --prefix=flight-deck/ HEAD | gzip -n > flight-deck.tar.gz
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: flight-deck.tar.gz
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" flight-deck.tar.gz --verify-tag --title "Flight Deck $RELEASE_TAG" --notes "Original working source. Verify this asset against .github/workflows/release.yml; a provenance check is not deployment approval."
